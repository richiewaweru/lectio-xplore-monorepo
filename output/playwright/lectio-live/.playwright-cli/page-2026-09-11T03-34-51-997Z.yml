          - button [ref=f6e81] [cursor=pointer]:
            - complementary [ref=f6e131]:
              - paragraph [ref=f6e132]: Check where the fulcrum really is
              - paragraph [ref=f6e133]: "Both readings put a fulcrum on the same seesaw, but only one names the point the plank actually turns around. Correct reading: the fulcrum is the central support the plank balances on. Pushing-end reading: the fulcrum is the end where the first child pushes down, because that is where the action happens. If the pushing end were the fulcrum, then the point the plank really pivots around would have no name at all, and the plank would be tilting around a place where nothing is touching. The end where a child pushes down is where the force acts, not where the plank turns. Before you name a fulcrum, point to the place the plank balances on."
          - button [ref=f6e86] [cursor=pointer]:
            - paragraph [ref=f6e135]: "Something counts as a lever when a rigid bar tilts around a fixed point: the push is applied away from that point, and the object being moved sits on the other side. A seesaw fits this rule exactly — the plank tilts around its centre, one child's push is the effort, and the child on the other end is the load — so it is a lever in its own right, not an exception. A bottle opener and a crowbar meet the same rule: each is a rigid bar turning around a fixed point, with effort applied away from it and the load on the opposite side, giving each a fulcrum, an effort, and a load. A wheel rolling in a straight line does not tilt around a fixed point, so it fails the rule and is not a lever."
          - button [ref=f6e89] [cursor=pointer]:
            - list [ref=f6e137]:
              - listitem [ref=f6e138]: A lever is a rigid bar that tilts around a fixed point, with the push applied away from that point and the thing being moved on the other side.
              - listitem [ref=f6e139]: "A seesaw is a lever: the plank tilts on its fixed point, one child pushes down away from that point, and the other child is the load being moved on the other side."
              - listitem [ref=f6e140]: "A bottle opener is a lever: the bar tilts on its fixed point, the hand pushes down away from that point, and the bottle cap is the load being moved on the other side."
              - listitem [ref=f6e141]: "A crowbar is a lever: the bar tilts on its fixed point, the hand pushes down away from that point, and the object being pried is the load being moved on the other side."
              - listitem [ref=f6e142]: "A wheel rolling in a straight line is not a lever: it does not tilt around a fixed point, so it does not fit the rule."
          - button [ref=f6e97] [cursor=pointer]:
            - paragraph [ref=f6e148]: You have met a lever on the seesaw and sorted some everyday tools into levers and non-levers. Now read the picture below, which shows a lever you have not seen before. For that new case, work out which part is the fulcrum, which part is the effort, and which part is the load, and name each one in its place. A correct reading means you have put all three parts where they belong — not just that you can say the three words.
