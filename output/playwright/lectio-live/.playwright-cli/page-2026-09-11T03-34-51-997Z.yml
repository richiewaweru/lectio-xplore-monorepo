              - text: "Picture a seesaw in a playground. One child presses down hard on their end of the plank, and the other end — with the second child sitting on it — lifts up into the air. The plank tips back and forth, but it never slides away or floats off. Watch the middle: something there stays put and holds the plank up while the two ends move. As you read on, keep asking yourself what the plank is tilting around, and why it can only tip at all because that one spot in the centre stays still. live-unit-edit-marker"
          - button [ref=f6e31] [cursor=pointer]:
            - complementary [ref=f6e109]:
              - paragraph [ref=f6e110]: What is the plank moving around?
              - paragraph [ref=f6e111]: "One child pushes down hard on one end of the seesaw plank. The other end, with the second child on it, rises into the air. But the plank does not float or slide away — it stays in place and tilts. Watch the middle of the seesaw: something there never lifts off the ground, no matter which end goes up or down. Before you go on, look at the plank and ask yourself: what is it tilting around? And what would happen to the tilt if that still point in the middle were not there?"
          - button [ref=f6e36] [cursor=pointer]:
            - heading "Naming the Three Parts of a Lever on the Seesaw" [level=2] [ref=f6e38]
          - button [ref=f6e39] [cursor=pointer]:
            - list [ref=f6e41]:
              - listitem [ref=f6e42]: A lever has exactly three parts, and on a seesaw each one sits at a different place on the plank.
              - listitem [ref=f6e43]: The fulcrum is the central support the plank balances on.
              - listitem [ref=f6e44]: The effort is the downward push the first child makes on one end of the seesaw.
              - listitem [ref=f6e45]: The load is the child on the other end, the one being lifted.
          - button [ref=f6e46] [cursor=pointer]:
            - 'figure "The seesaw has three separate labelled positions: the fulcrum at the central support the plank balances on, the effort at the end where the first child pushes down, and the load at the other end where the second child is being lifted." [ref=f6e48]':
              - 'img "A seesaw in a playground with one child seated at each end of a plank balanced on a central support. Labels mark three distinct places: fulcrum at the central support, effort at the end where the first child pushes down, and load at the end where the second child is lifted." [ref=f6e49]'
          - button [ref=f6e51] [cursor=pointer]:
            - paragraph [ref=f6e53]: "A lever is a rigid bar that tilts around a single fixed point. The push or pull from a force is applied at one place on the bar, while the thing being moved sits at another place. The fixed point is the fulcrum: it stays still as the bar turns. The effort is the push or pull applied to the lever, and the load is the object or resistance the lever moves. Fulcrum, effort, and load are therefore three different positions on the same bar, not three names for the push."
          - button [ref=f6e54] [cursor=pointer]:
            - complementary [ref=f6e56]:
              - paragraph [ref=f6e57]: The point that stays still
              - paragraph [ref=f6e58]: "A lever is a rigid bar that tilts around a single fixed point. The fulcrum is that fixed point — it does not move. The effort and the load are the two ends that do move: you apply the effort at one place to move the load at another."
          - button [ref=f6e59] [cursor=pointer]:
            - heading "Is the fulcrum where the pushing happens?" [level=2] [ref=f6e61]
          - button [ref=f6e62] [cursor=pointer]:
