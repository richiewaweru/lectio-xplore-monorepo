          - button [ref=e134] [cursor=pointer]:
            - complementary [ref=e136]:
              - paragraph [ref=e137]: Before you mix
              - paragraph [ref=e138]: You are making juice from a recipe that calls for 2 cups of concentrate and 3 cups of water, both poured into the pitcher. If a friend asked you to describe this recipe with just one short pairing of numbers instead of a whole sentence, what would that pairing be telling them about how to mix it?
          - button [ref=e139] [cursor=pointer]:
            - 'heading "2 Cups Concentrate to 3 Cups Water: A Ratio That Compares Two Quantities" [level=2] [ref=e141]'
          - button [ref=e142] [cursor=pointer]:
            - paragraph [ref=e144]: "The juice recipe calls for 2 cups of concentrate and 3 cups of water. Taken together, this pairing is a ratio: a ratio compares two quantities measured in the same kind of unit, and here both quantities are amounts of liquid measured in cups. Writing the ratio for this recipe as 2:3 says \"for every 2 cups of concentrate there are 3 cups of water.\" The two numbers are not two separate facts standing on their own; they form one paired comparison, describing the recipe as a single relationship between the concentrate and the water."
          - button [ref=e145] [cursor=pointer]:
            - paragraph [ref=e147]: "Read the recipe's two quantities in the order the ratio is written and they give 2:3 — 2 cups of concentrate written first, 3 cups of water written second. Write the same recipe's pairing the other way and you get 3:2: 3 cups of concentrate with only 2 cups of water. That swapped pairing is not this recipe read in reverse — it calls for more concentrate and less water, so it would make a stronger, more concentrated mixture. The order of the two quantities is part of what the ratio claims: 2:3 for this recipe is not the same as 3:2 for this recipe."
          - button [ref=e148] [cursor=pointer]:
