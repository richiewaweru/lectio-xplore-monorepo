          - button [ref=e170] [cursor=pointer]:
            - complementary [ref=e172]:
              - paragraph [ref=e173]: Order Is Part of the Ratio
              - paragraph [ref=e174]: "Take the juice recipe: 2 cups of concentrate and 3 cups of water. Written in that order, the ratio is 2:3 — concentrate first, water second. Now keep the same recipe but write the pairing the other way, 3:2. That reversed order would demand 3 cups of concentrate with only 2 cups of water, a stronger, more concentrated mixture. That is a different recipe, not the same recipe read in reverse. So the order of the two quantities is part of what the ratio claims: 2:3 for this recipe is not the same as 3:2 for this recipe."
