            - paragraph [ref=e211]: "Picture a pitcher of juice being mixed. The recipe calls for 2 cups of concentrate and 3 cups of water. Those are the two amounts that go in, and they stay two separate amounts: 2 cups of concentrate, 3 cups of water. Now suppose a friend asked you to pass this recipe along, not as a sentence but as one short pairing of numbers. What would that little pairing be telling your friend about how to mix the juice?"
