        - generic [ref=f4e97]:
          - generic [ref=f4e98]:
            - heading "Open attention on the seesaw and establish a reason to find out what makes it work." [level=3] [ref=f4e99]
            - generic [ref=f4e100]:
              - paragraph [ref=f4e101]: prose
              - textbox "Prose" [ref=f4e102]: CLOSEOUT_H_EDIT_MARKER. On a playground seesaw, one child pushes down while the other rises. The middle stays still — that still point is the fulcrum.
          - generic [ref=f4e103]:
            - heading "Build the three-part model of a lever and pin each part to a real position on the seesaw." [level=3] [ref=f4e104]
            - generic [ref=f4e105]:
              - paragraph [ref=f4e106]: prose
              - textbox "Prose" [ref=f4e107]: "A lever has exactly three parts, and each one is a different place on the seesaw. The plank rests on a central support, and that support is the fulcrum. It is the point the plank balances on, so it stays in one spot while the two ends move up and down. The effort is the downward push one child makes on an end of the plank. That push is the force applied to the lever, and it happens at the pushing end, not at the support. The load is the child on the other end who is being lifted. This is the part the lever acts on, and it sits at the opposite end from the push. These are three different places on the seesaw: the central support, the end where the push is made, and the end where the other child is raised. Each has its own name because each does its own job in the lever."
            - generic [ref=f4e108]:
              - paragraph [ref=f4e109]: prose
              - textbox "Prose" [ref=f4e110]: "A lever is a rigid bar that tilts around one fixed point instead of sliding or rolling along the ground. Because that bar tips rather than moves as a whole, a force applied at one place on the bar can act on something at a different place, and work that would be hard to do directly becomes easier. This is what makes a lever a simple machine: it is a tool that makes work easier by changing where and how a force, which is a push or a pull, is applied. The fixed point a lever turns around is called the fulcrum, and it is what separates the two ends that do move. The effort is the end of the bar where the push or pull is applied, and the load is the end that acts on the thing being moved. So the fulcrum stays still while the effort and the load swing up and down on either side of it, and telling these three parts apart is what lets you describe how any tilting bar is being used."
          - generic [ref=f4e111]:
            - heading "Set the three-part model beside the two beliefs that would misplace or deny it." [level=3] [ref=f4e112]
            - generic [ref=f4e113]:
              - paragraph [ref=f4e114]: choices
              - paragraph [ref=f4e115]: A person uses a bottle opener to lift the metal cap off a glass bottle. The opener rests on the bottle's rim and pulls up on the cap when the handle is pressed. In this action, what is the fulcrum?
              - generic [ref=f4e116]:
                - text: a
                - textbox "a" [ref=f4e117]: The point where the opener rests on the bottle's rim
              - generic [ref=f4e118]:
