              - generic [ref=f4e122]:
                - text: d
                - textbox "d" [ref=f4e123]: The entire bottle opener, since it is one solid tool
            - generic [ref=f4e124]:
              - paragraph [ref=f4e125]: choices
              - paragraph [ref=f4e126]: A child sits on one end of a seesaw. A teenager pushes down on the other end to raise the child. What are the effort and the load in this action?
