          - 'button "Open attention on the juice recipe and make the reader''s question concrete: what does ''2 cups concentrate and 3 cups water'' actually tell you before you mix it?" [ref=e29] [cursor=pointer]'
          - 'button "Build the core understanding: name the pairing as a ratio, state what a ratio compares, and then make the order claim visible by laying the recipe''s two quantities out in reading order and in reversed order." [ref=e30] [cursor=pointer]'
