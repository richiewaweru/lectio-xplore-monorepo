              - paragraph [ref=e84]: "A recipe writes a ratio as 2:3. Explain what this comparison means. In your explanation, name both quantities and the unit they are measured in, and use the order in which they are written to justify why 2:3 describes the mixture it does rather than a different one. Remember: if the reversed order described the same mixture, you would have no reason to prefer the written order — so account for the order, and do not treat 2:3 and 3:2 as interchangeable."
