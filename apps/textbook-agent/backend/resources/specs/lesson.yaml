# Resource spec = selection list. It may only narrow what a lesson can use (intents, objects, answer key).
# It contains NO teaching guidance: lesson design lives in resources/skeletons.yaml.

id: lesson
label: Lesson
version: "2.0"

intent: >
  A full classroom lesson for one approved path objective. Its teaching sequence comes from the lesson's skeleton recipe.

produces_answer_key: true

vocabulary:
  intents:
    permitted:
      - orient
      - activate-prior-knowledge
      - define
      - explain
      - explain-cause
      - demonstrate
      - practise-guided
      - practise-independent
      - check-understanding
      - diagnose-misconception
      - warn
      - emphasise
      - summarise
      - connect-forward
      - name-parts
      - show-structure
      - sequence
      - compare
      - classify
      - trace-flow
      - interpret
      - derive
      - apply
      - connect-back
      - memory-aid
    excluded:
      investigate: >
        Inquiry design requires a practical/investigation resource and its own
        evidence and page budget.
      evaluate: >
        Extended evaluation needs explicit criteria and evidence space outside
        the first-exposure lesson slice.
      transfer: >
        Far transfer belongs after successful familiar application.
      model-thinking: >
        Deferred until decision-commentary generation can be evaluated reliably.
      reflect: >
        Reflection is not required at the close of every lesson.
      state-goal: >
        The objective is already represented by lesson/section structure; do not
        spend a separate block repeating it.
  objects:
    allowed:
      - prose
      - list
      - table
      - figure
      - worked-example
      - questions
      - aside
      - choices
      - heading
      - answer-key
    excluded: {}
