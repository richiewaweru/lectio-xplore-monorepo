# Resource Spec: Lesson
# Version: 1.0
# Pedagogical owner: Lectio
# Last updated: 2026-06-21

id: lesson
label: Lesson
version: "1.0"

intent: |
  A lesson is the default full teaching resource. It introduces a concept,
  builds understanding, models the method, gives students guided-to-independent
  practice, and closes with a retention check.

  A lesson teaches before it asks students to perform independently. It is not
  a worksheet, not a quick reference, and not a quiz. The teacher should be
  able to use it as the main classroom arc for first contact with a concept.

  The pedagogical arc is: orient -> build -> model -> practice -> close.
  Every section must serve that arc. The planner must not skip the modelling
  step, and it must not turn the close into a second teaching section.

when_to_use:
  - First exposure to a new concept
  - A full classroom lesson with explicit teaching and practice
  - When the teacher wants one coherent teaching arc from hook to check
  - When learners need explanation before independent work

never_use_when:
  - The teacher only wants practice questions - use a worksheet or practice set
  - The teacher only wants a fast definition or reminder - use a quick explainer
  - The session is primarily assessment - use a quiz or exit ticket
  - Students already know the concept and only need repetition

allowed_outcomes: [teach_new_concept, develop_understanding, first_exposure_to_practice]

depth:
  quick:
    sections: "4"
    min_sections: 4
    max_sections: 4
    time_minutes: "15-20"
    questions: "3-4"
    note: >
      Keep the full teaching arc, but compress build and model to one tight
      example and keep the close brief.
  standard:
    sections: "5"
    min_sections: 5
    max_sections: 5
    time_minutes: "30-40"
    questions: "4-6"
    note: >
      This is the default lesson shape: orient, build, model, practice, close.
  deep:
    sections: "5-6"
    min_sections: 5
    max_sections: 6
    time_minutes: "45-60"
    questions: "6-8"
    note: >
      Deep lessons may expand the build or practice work, or add one optional
      section when the concept genuinely needs it.

sections:
  required:
    - role: orient
      intent: >
        Open the lesson and create felt need. Activate prior knowledge, set the
        context, and introduce the anchor example without fully teaching the
        concept yet.
      preferred_components:
        - section-header
        - hook-hero
        - prerequisite-strip
      allowed_components:
        - explanation-block
        - callout-block
        - what-next-bridge
        - section-divider
        - diagram-block
      forbidden_components:
        - practice-stack
        - quiz-check
        - short-answer
        - fill-in-blank

    - role: build
      intent: >
        Make the concept precise. Define vocabulary, state key facts, and name
        the central principle the lesson depends on.
      preferred_components:
        - definition-card
        - key-fact
        - explanation-block
      allowed_components:
        - definition-family
        - glossary-rail
        - insight-strip
        - comparison-grid
        - callout-block
        - diagram-block
        - diagram-compare
      forbidden_components:
        - practice-stack
        - quiz-check

    - role: model
      intent: >
        Demonstrate the method on the anchor. Show the reasoning step by step
        before any independent work, and surface the main pitfall while the
        teacher is still guiding.
      preferred_components:
        - worked-example-card
        - process-steps
      allowed_components:
        - pitfall-alert
        - key-fact
        - callout-block
        - diagram-block
        - diagram-series
      forbidden_components: []

    - role: practice
      intent: >
        Move into independent application with a warm-to-cold progression that
        fits the inferred lesson mode and the lesson depth.
      preferred_components:
        - practice-stack
        - reflection-prompt
      allowed_components:
        - quiz-check
        - student-textbox
        - short-answer
        - fill-in-blank
        - pitfall-alert
        - diagram-block
      forbidden_components: []

    - role: close
      intent: >
        Consolidate the lesson, check retention, and bridge to what the concept
        enables next. Do not reteach the build section here.
      preferred_components:
        - summary-block
        - quiz-check
        - what-next-bridge
      allowed_components:
        - key-fact
        - reflection-prompt
        - callout-block
      forbidden_components:
        - worked-example-card

  optional:
    - role: build
      intent: >
        An optional second build section is only justified when the concept has
        two distinct knowledge pieces that would overload a single section.
      preferred_components:
        - comparison-grid
        - definition-card
        - explanation-block
      allowed_components:
        - key-fact
        - insight-strip
        - diagram-block
      max_count: 1

    - role: practice
      intent: >
        An optional extension practice section for deep lessons. Use only when
        students need a genuine second wave of application.
      preferred_components:
        - practice-stack
        - reflection-prompt
      allowed_components:
        - short-answer
        - student-textbox
        - diagram-block
      max_count: 1

forbidden_components: []

supports: {}

visuals:
  quick: 1
  standard: 1
  deep: 2
  allow_diagrams: true
  allow_images: true
  note: >
    Visuals should support conceptual understanding, especially in orient and
    model. They are not decorative and should not displace the teaching arc.

text:
  density: medium
  max_reading_load: moderate
  note: >
    Keep teacher-facing clarity without turning the lesson into lecture notes.
    Explanation should be purposeful, direct, and matched to reading level and
    language support.

validation:
  - "Must contain at least one practice-stack, short-answer, or fill-in-blank"
  - "Must contain a worked-example-card or process-steps in the model section"
  - "Must contain summary-block, quiz-check, or what-next-bridge in the close section"
  - "Must not use worked-example-card in the close section"
  - "At most two sections may require visuals"
