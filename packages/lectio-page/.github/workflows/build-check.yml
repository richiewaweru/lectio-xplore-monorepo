name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Guard canonical lockfile policy
        run: |
          test ! -f package-lock.json || (echo "package-lock.json is not supported. Use pnpm-lock.yaml only." && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Export contracts
        run: pnpm export-contracts

      - name: Build package
        run: pnpm package

      - name: Pack dry-run
        run: pnpm pack --dry-run

      - name: Fixture PDFs
        run: pnpm pdf:fixture
