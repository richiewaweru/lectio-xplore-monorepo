          - button [ref=f5e34] [cursor=pointer]:
            - heading "A lamp, a child, and a wall" [level=2] [ref=f5e36]
          - button [active] [ref=f5e37] [cursor=pointer]:
            - textbox "Paragraph text" [ref=f5e177]:
              - /placeholder: Write a paragraph…
              - text: A child stands between a bright lamp and a wall. The lamp is on one side of the child, and the wall is on the other. Somewhere in this scene, a dark patch appears. Where do you think the dark patch will appear — on the wall behind the child, on the lamp side of the child, or underneath the child?
          - button [ref=f5e40] [cursor=pointer]:
            - complementary [ref=f5e42]:
              - paragraph [ref=f5e43]: Where will the dark patch land?
              - paragraph [ref=f5e44]: "A child stands between a bright lamp and a wall. The lamp is on one side of the child, and the wall is on the other side. A dark patch appears somewhere in this scene. Before anything is explained, decide where you think the dark patch will appear: on the wall behind the child, on the lamp side of the child, or underneath the child."
          - button [ref=f5e45] [cursor=pointer]:
            - paragraph [ref=f5e47]: Think back to what you already know about light. Light leaves a source, such as a lamp, and travels outward in straight lines. In the scene with the lamp, the child and the wall, light spreads out from the lamp in every direction, and each straight line of light carries on in the same direction as it travels toward the child and the wall. Notice how the light from the lamp fans out as it goes — each ray keeps to its own straight path rather than bending or curving on the way.
          - button [ref=f5e48] [cursor=pointer]:
            - figure "Light rays travelling in straight lines from the lamp, spreading outward toward the child and the wall." [ref=f5e50]:
              - img "A bright lamp on the left of a room sends straight lines of light outward in a fan shape. The straight lines travel across the space toward a child standing in the middle and continue toward the wall on the right." [ref=f5e51]
          - button [ref=f5e54] [cursor=pointer]:
            - paragraph [ref=f5e56]: "Picture the lamp, the child, and the wall again. The lamp's light travels in straight lines toward the child and the wall behind them. Because the child's body is opaque, it blocks all the light that hits it. So the straight-line light that would have reached the part of the wall directly behind the child never gets there — it is stopped at the child. The shadow is simply that region on the wall where light was blocked. It is not an object or substance the child gives off, and the child does nothing to make it: the shadow is what is missing from the light on the far side of the child from the lamp."
          - button [ref=f5e57] [cursor=pointer]:
            - complementary [ref=f5e59]:
              - paragraph [ref=f5e60]: A shadow is missing light, not something the child gives off
              - paragraph [ref=f5e61]: "Follow the straight-line rays from the lamp toward the child. The child's body is opaque, so it blocks those rays — the light that would have reached the part of the wall behind the child never gets there. That dark region on the wall is the shadow: it is where light was blocked, on the far side of the child from the lamp. The child does nothing to create it and gives off no shadow substance; the shadow is simply what is missing from the light."
          - button [ref=f5e62] [cursor=pointer]:
            - figure "A lamp lights a child standing between the lamp and a wall. The lamp sits on the left, the opaque child stands in the middle, and the wall is on the right. Straight-line rays from the lamp stop at the child, so the dark shadow falls on the wall directly behind the child, on the side opposite the lamp, while the lit region on the wall is where rays pass the child and land." [ref=f5e64]:
              - img "Diagram of a lamp on the left, an opaque child in the middle, and a wall on the right. Straight-line light rays travel from the lamp to the child and are blocked, producing a dark shadow on the wall directly behind the child and on the side opposite the lamp. The wall area reached by rays that pass the child is lit." [ref=f5e65]
          - button [ref=f5e68] [cursor=pointer]:
            - list [ref=f5e70]:
              - listitem [ref=f5e71]: The lamp is the light source, placed on one side of the scene.
              - listitem [ref=f5e72]: The child stands in the middle and is opaque, so light cannot pass through.
              - listitem [ref=f5e73]: The wall is on the other side of the child, away from the lamp.
              - listitem [ref=f5e74]: Straight-line rays from the lamp are stopped by the child and never reach the wall behind them.
              - listitem [ref=f5e75]: The dark region on the wall directly behind the child is the shadow.
              - listitem [ref=f5e76]: The lit region on the wall is where rays pass the child and land.
              - listitem [ref=f5e77]: The shadow sits on the side of the child opposite the lamp, not beside or under the child.
          - button [ref=f5e78] [cursor=pointer]:
            - paragraph [ref=f5e80]: Compare two objects placed in exactly the same spot between the lamp and the wall. In the first case the child stands there. The child's body is opaque, so it blocks all the light travelling from the lamp, and a clear shadow falls on the wall on the far side of the child from the lamp. In the second case the child is replaced by a translucent sheet held in the same place. The sheet blocks only some of the light, so the shadow is faint rather than dark — but it is still on the wall opposite the lamp, in the same position as before. Swapping the child for the sheet does not move the shadow. What changes is how much light the material blocks, and so how dark the shadow appears.
          - button [ref=f5e81] [cursor=pointer]:
            - figure "Comparing the same lamp-and-wall setup with two different objects in the path of the light. Both shadows fall on the far side of the object from the lamp; only the material changes, so the shadow's darkness is the difference to read." [ref=f5e83]:
