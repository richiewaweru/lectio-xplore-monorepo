          - button [ref=f5e103] [cursor=pointer]:
            - complementary [ref=f5e105]:
              - paragraph [ref=f5e106]: Pause and check your thinking
              - paragraph [ref=f5e107]: "Before reading on, think about this claim: \"The child makes a shadow the way a lamp makes light.\" If you agree, you are treating the shadow as something the child produces straight away. The target idea is different: the child does not create a shadow. The child's body is opaque, so it blocks the light travelling in straight lines from the lamp. The shadow is not made by the child — it is the light that is missing on the wall on the far side of the child. Agreeing with the claim would show that you think the object gives off a shadow; rejecting it shows that you understand the shadow is the absence of light left when an opaque object blocks the rays."
          - button [ref=f5e108] [cursor=pointer]:
            - paragraph [ref=f5e110]: "The child is not like the lamp. A lamp is a light source — it gives out light — but the child gives out nothing. The child is opaque, so when light travelling in straight lines from the lamp reaches the child it is blocked. Beyond the child, on the far side from the lamp, that light never arrives, and the dark patch left where the light is missing is the shadow you see on the wall. The shadow is not something the child makes: it is the shape of the light that the child stops."
          - button [ref=f5e111] [cursor=pointer]:
            - complementary [ref=f5e113]:
              - paragraph [ref=f5e114]: Which side does the dark patch land on?
              - paragraph [ref=f5e115]: "Picture the same scene: a bright lamp on one side, the child standing between the lamp and the wall. Here is a claim to consider: \"The dark patch appears between the lamp and the child, on the lamp's side.\" Do you agree, disagree, or are you unsure? Notice which side you chose. Then check the target model: light travels in straight lines from the lamp, so it reaches the child and is blocked there. The light cannot bend around the child to reach the wall on the far side. Because the child blocks the straight-line light, the dark patch forms on the far side of the child, on the wall behind the child, opposite the lamp. It does not appear on the lamp's side, because that side of the child is still lit by the lamp."
          - button [ref=f5e116] [cursor=pointer]:
            - paragraph [ref=f5e118]: "Consider the claim: in the lamp-and-wall setup, the dark patch appears between the lamp and the child, on the lamp's side. If you agreed, or you were unsure, that is an important belief to examine. Light travels in a straight line from the lamp, and when it reaches the child — an opaque object — it is blocked. Because the light is stopped at the child, it cannot continue past to the wall on the far side, and that is exactly where the shadow lands: on the wall behind the child, opposite the lamp. So the dark patch does not appear on the lamp's side; it appears on the opposite side of the child from the lamp."
